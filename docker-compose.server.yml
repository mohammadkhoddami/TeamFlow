# Self-hosted production stack for the shared VPS (arsene.ir/flow).
#
# Deployed by CI as /var/www/teamflow/docker-compose.yml — the ONLY file that
# lives there. Images come from GHCR (built by .github/workflows/ci-cd.yml);
# the host needs no source checkout, Dockerfile, or .env.
#
# All configuration is read from the deploy shell environment (CI exports the
# GitHub secrets/vars before running `docker compose`). Required values use
# ${VAR:?} so a misconfigured deploy fails before touching anything.
#
# Layout:
#   api   127.0.0.1:8020  FastAPI (also serves /flow/admin via the host nginx)
#   web   127.0.0.1:8030  SPA container; host nginx proxies /flow/ here
#   minio 127.0.0.1:9010  attachments; host nginx proxies /teamflow-attachments
name: teamflow

x-app-env: &app-env
  APP_NAME: ${APP_NAME:-TeamFlow API}
  ENVIRONMENT: ${ENVIRONMENT:-production}
  DEBUG: "${DEBUG:-false}"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: "${LOG_JSON:-true}"
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (GitHub secret)}
  ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-30}"
  REFRESH_TOKEN_EXPIRE_DAYS: "${REFRESH_TOKEN_EXPIRE_DAYS:-14}"
  POSTGRES_USER: ${POSTGRES_USER:-teamflow}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (GitHub secret)}
  POSTGRES_DB: ${POSTGRES_DB:-teamflow}
  # Override DATABASE_URL directly if the password is not URL-safe.
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-teamflow}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-teamflow}}
  DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:-postgresql+psycopg://${POSTGRES_USER:-teamflow}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-teamflow}}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-true}"
  AUTH_RATE_LIMIT_MAX: "${AUTH_RATE_LIMIT_MAX:-5}"
  AUTH_RATE_LIMIT_WINDOW: "${AUTH_RATE_LIMIT_WINDOW:-60}"
  CORS_ORIGINS: '${CORS_ORIGINS:-["https://arsene.ir","https://www.arsene.ir"]}'
  S3_ENDPOINT: ${S3_ENDPOINT:-arsene.ir}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY (GitHub secret)}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY (GitHub secret)}
  S3_BUCKET: ${S3_BUCKET:-teamflow-attachments}
  S3_SECURE: "${S3_SECURE:-true}"
  EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
  EMAIL_FROM: ${EMAIL_FROM:-teamflow@arsene.ir}
  SMTP_HOST: ${SMTP_HOST:-localhost}
  SMTP_PORT: "${SMTP_PORT:-1025}"
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  # Email OTP + Google sign-in (empty client id/secret disables Google).
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://arsene.ir/flow/api/v1/auth/google/callback}
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://arsene.ir/flow}
  WEBHOOK_HTTPX_TRUST_ENV: "${WEBHOOK_HTTPX_TRUST_ENV:-false}"
  ADMIN_ENABLED: "${ADMIN_ENABLED:-true}"
  ADMIN_BASE_URL: ${ADMIN_BASE_URL:-/flow/admin}
  ADMIN_TITLE: ${ADMIN_TITLE:-TeamFlow Admin}
  ADMIN_SESSION_MAX_AGE_SECONDS: "${ADMIN_SESSION_MAX_AGE_SECONDS:-28800}"

x-app: &app
  image: ghcr.io/arsene-ir/teamflow:${IMAGE_TAG:-latest}
  environment: *app-env
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teamflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (GitHub secret)}
      POSTGRES_DB: ${POSTGRES_DB:-teamflow}
    volumes:
      - teamflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - teamflow_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # MinIO removed its official images from Docker Hub and made quay.io pulls
  # require auth (2025-2026); alpine/minio packages the last community release.
  # The API creates the bucket at startup (ensure_bucket), so no mc sidecar.
  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    # Official MinIO images ran as root and the data volume is root-owned;
    # keep that so existing volumes stay writable (alpine/minio defaults to
    # the non-root `minio` user).
    user: "0:0"
    command: server /data --address ":9000"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY (GitHub secret)}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY (GitHub secret)}
    volumes:
      - teamflow_miniodata:/data
    ports:
      - "127.0.0.1:9010:9000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    <<: *app
    environment:
      <<: *app-env
      # Trust the CDN/nginx X-Forwarded-For chain so rate limits and audit
      # entries use the real client IP instead of the proxy socket peer.
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "127.0.0.1:8020:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    <<: *app
    command:
      ["celery", "-A", "app.workers.celery_app:celery_app", "worker",
       "-l", "info", "-Q", "default,emails,webhooks", "--concurrency", "2"]
    healthcheck:
      disable: true

  beat:
    <<: *app
    command:
      ["celery", "-A", "app.workers.celery_app:celery_app", "beat",
       "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true

  web:
    image: ghcr.io/arsene-ir/teamflow-web:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:8030:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  teamflow_pgdata:
  teamflow_redisdata:
  teamflow_miniodata:
