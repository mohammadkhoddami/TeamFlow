# TeamFlow - single compose file.
#
# Production (default):
#   docker compose up -d --build
#
# Local development - infra only, run the API on the host:
#   docker compose up -d db redis
#   uv run alembic upgrade head
#   uv run uvicorn app.main:app --reload
#
# Local MinIO (only needed for attachment/S3 work):
#   docker compose --profile minio up -d
#
# Production secrets/credentials come from the environment (or .env); the
# defaults below are dev-only. Override POSTGRES_* and SECRET_KEY in production.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teamflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teamflow}
      POSTGRES_DB: ${POSTGRES_DB:-teamflow}
    # Bound to localhost so host-run dev tools can connect without exposing
    # Postgres on the network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - teamflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - teamflow_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_JSON: "true"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-teamflow}:${POSTGRES_PASSWORD:-teamflow}@db:5432/${POSTGRES_DB:-teamflow}
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-teamflow}:${POSTGRES_PASSWORD:-teamflow}@db:5432/${POSTGRES_DB:-teamflow}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 40s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      ["celery", "-A", "app.workers.celery_app:celery_app", "worker",
       "-l", "info", "-Q", "default,emails,webhooks", "--concurrency", "4"]
    env_file: .env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_JSON: "true"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-teamflow}:${POSTGRES_PASSWORD:-teamflow}@db:5432/${POSTGRES_DB:-teamflow}
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-teamflow}:${POSTGRES_PASSWORD:-teamflow}@db:5432/${POSTGRES_DB:-teamflow}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "-l", "info"]
    env_file: .env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_JSON: "true"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-teamflow}:${POSTGRES_PASSWORD:-teamflow}@db:5432/${POSTGRES_DB:-teamflow}
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-teamflow}:${POSTGRES_PASSWORD:-teamflow}@db:5432/${POSTGRES_DB:-teamflow}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  # Optional local object storage. Production should use a managed S3 bucket.
  minio:
    profiles: ["minio"]
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-teamflow}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-teamflow-secret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - teamflow_miniodata:/data
    restart: unless-stopped

  minio-setup:
    profiles: ["minio"]
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-teamflow} ${S3_SECRET_KEY:-teamflow-secret}; do sleep 1; done &&
      mc mb --ignore-existing local/${S3_BUCKET:-teamflow-attachments} &&
      echo 'MinIO bucket ready';
      exit 0"
    restart: "no"

volumes:
  teamflow_pgdata:
  teamflow_redisdata:
  teamflow_miniodata:
