# Development environment: `docker compose up -d db redis minio` for infra only,
# or `docker compose up` to run everything.
services:
  db:
    image: postgres:16-alpine
    container_name: teamflow-db
    environment:
      POSTGRES_USER: teamflow
      POSTGRES_PASSWORD: teamflow
      POSTGRES_DB: teamflow
    ports:
      - "5432:5432"
    volumes:
      - teamflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamflow -d teamflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: teamflow-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - teamflow_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    container_name: teamflow-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: teamflow
      MINIO_ROOT_PASSWORD: teamflow-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - teamflow_miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc alias set local http://localhost:9000 teamflow teamflow-secret && mc ready local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-setup:
    image: quay.io/minio/mc:latest
    container_name: teamflow-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 teamflow teamflow-secret &&
      mc mb --ignore-existing local/teamflow-attachments &&
      echo 'MinIO bucket ready';
      exit 0"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teamflow-api
    env_file: .env
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://teamflow:teamflow@db:5432/teamflow
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
      S3_BUCKET: teamflow-attachments
    command: >
      sh -c "uv sync --frozen && uv run alembic upgrade head &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teamflow-worker
    env_file: .env
    environment:
      ENVIRONMENT: development
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://teamflow:teamflow@db:5432/teamflow
      DATABASE_URL_SYNC: postgresql+psycopg://teamflow:teamflow@db:5432/teamflow
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
      S3_BUCKET: teamflow-attachments
    command: >
      sh -c "uv sync --frozen &&
             uv run celery -A app.workers.celery_app:celery_app worker -l info -Q default,emails,webhooks"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teamflow-beat
    env_file: .env
    environment:
      ENVIRONMENT: development
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://teamflow:teamflow@db:5432/teamflow
      DATABASE_URL_SYNC: postgresql+psycopg://teamflow:teamflow@db:5432/teamflow
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command: >
      sh -c "uv sync --frozen &&
             uv run celery -A app.workers.celery_app:celery_app beat -l info"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  teamflow_pgdata:
  teamflow_redisdata:
  teamflow_miniodata:
