name: ci-cd

# Build a GHCR image on every push/PR, then deploy to mhkhoddami-vps on main.
# No lint, type-check, or test steps by request.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name (lowercase) and tag
        id: meta
        run: |
          echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.name }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    needs: build
    # main only, and only once DEPLOY_ENABLED is 'true'.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Sync deploy compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_PORT || 22 }}
          source: docker-compose.server.yml
          target: ${{ vars.DEPLOY_PATH }}
          overwrite: true

      - name: Pull image, migrate, restart
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_PORT || 22 }}
          command_timeout: 15m
          script_stop: true
          script: |
            set -e
            cd "${{ vars.DEPLOY_PATH }}"

            IMAGE_TAG=sha-$(echo '${{ github.sha }}' | cut -c1-7)
            export IMAGE_TAG
            COMPOSE="docker compose -f docker-compose.server.yml"

            echo "==> Pulling $IMAGE_TAG"
            $COMPOSE pull api worker beat

            echo "==> Applying migrations"
            $COMPOSE run --rm api alembic upgrade head

            echo "==> Rolling out"
            $COMPOSE up -d --remove-orphans

            echo "==> Health check"
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8020/api/v1/health/ready; then
                echo
                echo "deploy OK ($IMAGE_TAG)"
                exit 0
              fi
              sleep 2
            done
            echo "health check failed" >&2
            exit 1
