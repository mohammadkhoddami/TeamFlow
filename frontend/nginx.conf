# Static SPA server for the TeamFlow frontend image.
#
# The host nginx (arsene.ir) routes /flow/api and /flow/ws straight to the
# API, and proxies /flow/* to this container, so it only serves files + the
# history fallback for client-side routing.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compose/health probes.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = /flow {
        return 301 /flow/;
    }

    # Hashed Vite assets are immutable.
    location /flow/assets/ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location = /flow/index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA history fallback (React Router).
    location /flow/ {
        try_files $uri $uri/ /flow/index.html;
    }

    # Nothing is served from the root.
    location / {
        return 302 /flow/;
    }
}
