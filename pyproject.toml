[project]
name = "teamflow"
version = "0.1.0"
description = "TeamFlow - multi-tenant project management and collaboration API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "pyjwt>=2.10",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1",
    "aiosmtplib>=3.0",
    "redis>=5.2",
    "celery>=5.4",
    "minio>=7.2",
    "httpx>=0.28",
    "gunicorn>=23.0",
    "sqladmin>=0.31.1",
    "itsdangerous>=2.2.0",
    "cryptography>=50.0.2",
    "python-dateutil>=2.9.0.post0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
