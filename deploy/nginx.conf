# TeamFlow edge proxy: TLS termination happens here (certs in a real
# deployment); this config covers HTTP routing, WebSocket upgrade, and
# sensible proxy headers.

upstream teamflow_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Real deployments add HSTS + TLS certs here.

    client_max_body_size 12m;  # uploads: 10 MB cap + envelope overhead

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 75s;  # > WS keepalive intervals

    location /ws/ {
        proxy_pass http://teamflow_api;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://teamflow_api;
    }

    location /api/v1/health/live {
        proxy_pass http://teamflow_api;
        access_log off;
    }
}
