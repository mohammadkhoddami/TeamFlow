# ============================================================
# TeamFlow (React SPA + FastAPI) — arsene.ir/flow/*
#
# Installed to /etc/nginx/snippets/teamflow.conf by CI and included inside
# the arsene.ir server block:
#     include /etc/nginx/snippets/teamflow.conf;
#
#   /flow/api/v1/*           -> 127.0.0.1:8020/api/v1/*   (FastAPI)
#   /flow/ws/*               -> 127.0.0.1:8020/ws/*       (WebSocket)
#   /flow/admin/*            -> 127.0.0.1:8020            (sqladmin)
#   /flow/*                  -> 127.0.0.1:8030            (frontend container)
#   /teamflow-attachments/*  -> 127.0.0.1:9010            (MinIO presigned
#                               URLs; Host must stay the public host because
#                               MinIO validates SigV4 against it)
# ============================================================

location = /flow {
    return 301 /flow/;
}

location /flow/api/ {
    proxy_pass http://127.0.0.1:8020/api/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

location /flow/ws/ {
    proxy_pass http://127.0.0.1:8020/ws/;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    proxy_connect_timeout 60s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_buffering off;
}

# TeamFlow admin panel (sqladmin). Path must match ADMIN_BASE_URL=/flow/admin.
# Passes the URI through unchanged, so the app mounted at /flow/admin matches.
# TLS terminates at ArvanCloud, so the edge's X-Forwarded-Proto must be
# forwarded (same pattern as the /flow/api/ and /flow/ws/ blocks).
location = /flow/admin {
    absolute_redirect off;
    return 301 /flow/admin/;
}

location /flow/admin/ {
    proxy_pass http://127.0.0.1:8020;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# SPA served by the frontend container (image built in CI).
location /flow/ {
    proxy_pass http://127.0.0.1:8030;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# Exact path: the MinIO SDK requests `/bucket?location=` without the
# trailing slash when resolving the region; without this it would fall
# through to the main site's `location /` proxy.
location = /teamflow-attachments {
    proxy_pass http://127.0.0.1:9010;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 20m;
}

location /teamflow-attachments/ {
    proxy_pass http://127.0.0.1:9010;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 20m;
}
